name: بناء تطبيقي أندرويد وويندوز

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'apps/**'
      - '.github/workflows/apps.yml'

permissions:
  contents: write

jobs:
  android:
    name: أندرويد (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: بناء الكتاب
        run: python3 source/build.py
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21' }
      - name: تجهيز مشروع أندرويد
        working-directory: apps/android
        run: |
          npm install --no-audit --no-fund
          mkdir -p www && cp ../../source/dist/book.html www/index.html
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#B04D2A' --splashBackgroundColor '#FBF7EE'
          bash scripts/patch-android.sh
          npx cap sync android
      - name: رقم الإصدار
        working-directory: apps/android/android
        run: |
          # رقم متزايد مع كل بناء حتى يُثبَّت التحديث فوق القديم
          sed -i -E "s/versionCode [0-9]+/versionCode $((100 + GITHUB_RUN_NUMBER))/; s/versionName \"[^\"]*\"/versionName \"1.1.${GITHUB_RUN_NUMBER}\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle
      - name: بناء APK موقّع
        working-directory: apps/android/android
        env:
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$SIGNING_PASSWORD" ]; then
            printf '%s' "$SIGNING_PASSWORD" > "$RUNNER_TEMP/pw"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in ../release.jks.enc -out "$RUNNER_TEMP/release.jks" -pass file:"$RUNNER_TEMP/pw"
            rm -f "$RUNNER_TEMP/pw"
            ./gradlew assembleRelease --no-daemon --stacktrace \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
              -Pandroid.injected.signing.store.password="$SIGNING_PASSWORD" \
              -Pandroid.injected.signing.key.alias=dulluni \
              -Pandroid.injected.signing.key.password="$SIGNING_PASSWORD"
            rm -f "$RUNNER_TEMP/release.jks"
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dulluni-souq-android.apk"
          else
            echo "::warning::لم يُضف السر ANDROID_SIGNING_PASSWORD؛ بُني بتوقيع تجريبي"
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/dulluni-souq-android.apk"
          fi
      - uses: actions/upload-artifact@v7
        with: { name: android-apk, path: dulluni-souq-android.apk, if-no-files-found: error }

  windows:
    name: ويندوز (مُثبِّت)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: بناء الكتاب
        run: python source/build.py
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - name: بناء المُثبِّت
        working-directory: apps/windows
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install --no-audit --no-fund
          mkdir -p app && cp ../../source/dist/book.html app/index.html && cp build/icon.png app/icon.png
          npx electron-builder --win nsis --x64 --publish never
          cp dist/*.exe "$GITHUB_WORKSPACE/dulluni-souq-setup.exe"
      - uses: actions/upload-artifact@v7
        with: { name: windows-setup, path: dulluni-souq-setup.exe, if-no-files-found: error }

  release:
    name: نشر الملفات
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: دلوني على السوق — إصدار ${{ github.run_number }}
          make_latest: true
          body: |
            - **dulluni-souq-android.apk**: أندرويد، للهاتف والتابلت. موقّع بمفتاح ثابت: التحديث يُثبَّت فوق السابق وتبقى التسجيلات.
            - **dulluni-souq-setup.exe**: ويندوز ١٠ و١١ (٦٤ بت). غير موقّع: إن ظهر تحذير SmartScreen فاختاروا «More info» ثم «Run anyway».
          files: |
            dulluni-souq-android.apk
            dulluni-souq-setup.exe
